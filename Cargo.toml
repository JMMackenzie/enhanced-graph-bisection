[package]
name = "rgbisect"
version = "0.1.0"
license = "MIT"
authors = ["Joel Mackenzie <joelmmackenzie@gmail.com>", "Antonio Mallia", "Alistair Moffat", "Matthias Petri"]
edition = "2024"
repository = "https://github.com/JMMackenzie/enhanced-graph-bisection"
readme = "README.md"
keywords = ["recursive-bisection", "index-compression", "inverted-index", "graph", "ciff"]
documentation = "https://docs.rs/rgbisect"
description = "The recursive graph bisection algorithm suite compresses indexes or graphs via identifier reassignment."
build = "build.rs"

[[bin]]
name = "create-rgb"
path = "src/bin/create-rgb.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
structopt = "0.3"
thiserror = "1.0"
anyhow = "1"
rand = "0.7"
rayon = "1.5.1"
lazy_static = "1.4"
indicatif = "0.15"
simplelog = "0.8"
log = "0.4"
protobuf = "2.14"
byteorder = "1"
bincode = "1.3.1"

[build-dependencies]
protobuf-codegen-pure = "2.14"
